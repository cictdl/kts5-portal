{% extends "console/base.html" %}
{% block title %}{{ 'Edit question' if q else 'New question' }}{% endblock %}
{% block content %}
<form method="post" class="card" style="max-width:820px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="fields">
    <div class="field"><label for="lang">Language</label><select id="lang" name="lang" required>{% for l in langs %}<option value="{{ l }}" {{ 'selected' if q and q.lang == l }}>{{ l|langname }}</option>{% endfor %}</select></div>
    <div class="field"><label for="qtype">Type</label><select id="qtype" name="qtype">{% for tp in qtypes %}<option value="{{ tp }}" {{ 'selected' if q and q.qtype == tp }}>{{ tp }}</option>{% endfor %}</select></div>
    <div class="field wide"><label for="text">Question text</label><textarea id="text" name="text" rows="4" required>{{ q.text if q else '' }}</textarea></div>
    {% for L in ['a', 'b', 'c', 'd'] %}<div class="field"><label for="opt_{{ L }}">Option {{ L|upper }}</label><input type="text" id="opt_{{ L }}" name="opt_{{ L }}" value="{{ q['opt_' + L] if q else '' }}" required></div>{% endfor %}
    <div class="field"><label for="correct">Correct option</label><select id="correct" name="correct" required>{% for L in ['A', 'B', 'C', 'D'] %}<option value="{{ L }}" {{ 'selected' if q and q.correct == L }}>{{ L }}</option>{% endfor %}</select></div>
    <div class="field"><label for="kural_no">Kural number (optional)</label><input type="number" id="kural_no" name="kural_no" min="1" max="1330" value="{{ q.kural_no or '' if q else '' }}"></div>
    <div class="field"><label for="difficulty">Difficulty (1–3)</label><input type="number" id="difficulty" name="difficulty" min="1" max="3" value="{{ q.difficulty if q else 1 }}"></div>
    <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" name="active" value="1" {{ 'checked' if (q and q.active) or not q }}> Active</label></div>
  </div>
  <div class="btn-row" style="margin-top:14px"><button class="btn" type="submit">Save</button><a class="btn ghost" href="{{ url_for('admin.questions') }}">Cancel</a></div>
</form>
{% endblock %}
