{% extends "console/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:520px">
  {% if forced %}<div class="alert warning">Set a new password before continuing.</div>{% endif %}
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field" style="margin-bottom:10px"><label for="current">Current password</label><input type="password" id="current" name="current" required autocomplete="current-password"></div>
    <div class="field" style="margin-bottom:10px"><label for="new">New password</label><input type="password" id="new" name="new" required minlength="10" autocomplete="new-password"><span class="help">At least 10 characters with a capital letter and a digit.</span></div>
    <div class="field" style="margin-bottom:14px"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" required autocomplete="new-password"></div>
    <button class="btn" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
