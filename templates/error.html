{% extends "base.html" %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% block content %}
<div class="wrap-narrow section">
  <div class="card accent">
    <span class="eyebrow">{{ code }}</span>
    <h1>{{ title }}</h1>
    <p class="dim">{{ text }}</p>
    <div class="btn-row"><a class="btn" href="{{ url_for('public.home') }}">{{ t('nav.home') }}</a><a class="btn secondary" href="{{ url_for('public.contact') }}">{{ t('nav.contact') }}</a></div>
  </div>
</div>
{% endblock %}
